# Runs the project's ONE verify chain — .quetrex/verify.json — on every pull
# request, in a runner nobody in the pipeline can talk out of an exit code.
#
# Why this exists: the Stop gate (verify-gate.sh) and the merge gate both read a
# ledger written on the developer's machine. That is the right place for the
# fast loop, but it means the agent producing the work is also the process
# producing the evidence. This workflow re-derives the same evidence somewhere
# an agent cannot reach, and publishes the ledger as an artifact so a human (or
# the reviewer) can diff CI's ledger against the one in the branch.
#
# OWNER ACTION: make "verify chain" a REQUIRED status check on the default
# branch (Settings -> Branches -> branch protection). Until it is required, a
# red run is only advisory.
name: verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify chain
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR head (not the merge commit)
        uses: actions/checkout@v4
        with:
          # Pin to the exact commit under review so every ledger line's `sha`
          # matches the commit the merge gate will be asked to authorize.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # --ignore-scripts is mandatory: this package's `postinstall` runs
        # install.js, which writes into ~/.claude. CI must never install the
        # harness onto the runner; it only verifies the source tree.
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          elif [ "$(node -p "Object.keys({...(require('./package.json').dependencies||{}), ...(require('./package.json').devDependencies||{})}).length")" != "0" ]; then
            npm install --ignore-scripts --no-audit --no-fund
          else
            echo "no dependencies declared — nothing to install"
          fi

      - name: Run the .quetrex/verify.json chain
        id: chain
        run: |
          set +e
          set -uo pipefail

          if [ ! -f .quetrex/verify.json ]; then
            echo "::error::.quetrex/verify.json is missing. The verify chain is the gate; CI will not guess one."
            exit 1
          fi

          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          LEDGER=".quetrex/verify-ledger.jsonl"
          : > "$LEDGER"
          FAILED=0
          COUNT=0

          while IFS= read -r cmd; do
            [ -n "$cmd" ] || continue
            COUNT=$((COUNT + 1))
            echo "::group::$cmd"
            OUT="$(bash -c "$cmd" 2>&1)"
            CODE=$?
            printf '%s\n' "$OUT"
            echo "::endgroup::"

            jq -cn \
              --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg cmd "$cmd" \
              --arg cwd "$PWD" \
              --arg sha "$SHA" \
              --argjson exit "$CODE" \
              --arg tail "$(printf '%s' "$OUT" | tail -n 20)" \
              '{ts:$ts,cmd:$cmd,cwd:$cwd,sha:$sha,exit:$exit,tail:$tail}' >> "$LEDGER"

            if [ "$CODE" -ne 0 ]; then
              echo "::error::verify chain RED — \`$cmd\` exited $CODE"
              FAILED=1
            fi
          done < <(jq -r '.verify[]?' .quetrex/verify.json)

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::.quetrex/verify.json resolved to an EMPTY chain. An empty chain is not a green chain."
            exit 1
          fi

          echo "ran $COUNT command(s); failed=$FAILED"
          exit "$FAILED"

      - name: Publish the verify ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-ledger-${{ github.event.pull_request.head.sha || github.sha }}
          path: .quetrex/verify-ledger.jsonl
          if-no-files-found: warn
          retention-days: 30
