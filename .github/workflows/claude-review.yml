# Independent review-gate, executed by a runner instead of by the pipeline.
#
# The defect this closes: in the live pipeline the agent that DECIDES the verdict
# is also the agent that REPORTS whether independent review ran. It self-exempted
# once already — a verdict of AUTO_MERGE over 18 files carrying
# "nativeReview": "not_run_no_pr" and "nativeSecurityReview": "not_available_in_env".
# Here the verdict is written to .quetrex/review-verdict.json by Claude, and a
# separate shell step — which Claude cannot influence — turns that file into the
# job's exit status and a check run. "Review did not run" is now a red job, not a
# field in a JSON file the reviewer wrote about itself.
#
# ############################################################################
# # DO NOT ADD `--bare` TO claude_args. EVER.                                 #
# # `claude --help`: "--bare  Minimal mode: skip hooks, LSP, plugin           #
# # --settings, --agents, --plugin-dir."                                      #
# # Course L6 recommends --bare for CI determinism. For THIS product that     #
# # advice is inverted: --bare turns off the entire enforcement layer — every #
# # PreToolUse deny, the Stop gate, the merge gate, and the agent definitions #
# # this workflow's prompt depends on — and it does so SILENTLY. The job      #
# # would still go green. Determinism is not worth an unenforced pipeline.    #
# # `-p`/--print is likewise off-limits here: it skips hook auto-discovery.   #
# ############################################################################
#
# OWNER ACTION (once, needs repo admin): this workflow cannot start without a
# credential, and until then EVERY pull request shows a red review gate.
#
#   claude setup-token                       # mints a 1-year subscription token
#   gh secret set CLAUDE_CODE_OAUTH_TOKEN    # paste it
#
# On a Pro/Max/Team/Enterprise plan that is all you need — no Console API key,
# no separate per-token billing. ANTHROPIC_API_KEY remains supported for
# API-billed setups; set one or the other, not both.
name: claude-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: review gate
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - name: Check out the PR head (not the merge commit)
        uses: actions/checkout@v4
        with:
          # The verdict is sha-pinned. It must pin to the commit under review,
          # not to a synthetic merge commit that exists only inside this runner.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run the review-gate contract
        uses: anthropics/claude-code-action@v1
        with:
          # Either credential works; set ONE of these repo secrets.
          #
          # CLAUDE_CODE_OAUTH_TOKEN is preferred on a Pro/Max/Team/Enterprise
          # plan: run `claude setup-token` once, which mints a one-year token
          # against the SUBSCRIPTION YOU ALREADY PAY FOR. An ANTHROPIC_API_KEY is
          # a Console credential billed separately per token, which is pure
          # duplicate spend for a subscriber. The token can only make model
          # requests — exactly what this job needs.
          #
          # Rotate it yearly; when it lapses this job fails closed (no verdict ->
          # red gate), which is the correct direction to fail.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You are running the Quetrex review gate on pull request
            #${{ github.event.pull_request.number }} at commit
            ${{ github.event.pull_request.head.sha }}.

            Read `.claude/agents/reviewer.md` in this repository and execute that
            contract exactly, on this PR's diff against the base branch. It is the
            single definition of the gate — do not substitute your own review
            process, and do not soften any of its rules.

            The contract is satisfied only when `.quetrex/review-verdict.json`
            exists, is valid JSON, and contains:
              - `.verdict` — exactly one of AUTO_MERGE, REWORK, ESCALATE_HUMAN
              - `.sha` — ${{ github.event.pull_request.head.sha }}
              - `.inputs.nativeReview` and `.inputs.nativeSecurityReview`
                recording the real outcome of the native review tools

            If a native tool could not run, record that honestly and let the
            contract's own rules decide the verdict. Do NOT choose AUTO_MERGE to
            keep this job green — a later shell step reads the file you write and
            sets the exit status from it, so an unearned AUTO_MERGE is a lie that
            fails the job anyway once a human reads the ledger.
          # --max-turns bounds the outer agent loop so a stuck review cannot burn
          #   the whole budget; the reviewer subagent carries its own maxTurns.
          # --permission-mode dontAsk is the unattended mode: only pre-approved
          #   tools run, everything else is auto-denied with no prompt, so the job
          #   can never hang on an approval nobody is present to give.
          # --allowed-tools is REQUIRED alongside dontAsk — without a pre-approved
          #   set, dontAsk denies everything and the review silently does nothing.
          #   The PreToolUse hooks (deny-guard, secret-scan, enforce-branch) still
          #   fire beneath this allow-list; they are the layer under permissions.
          claude_args: >-
            --max-turns 25
            --permission-mode dontAsk
            --allowed-tools "Read,Grep,Glob,Bash,Task,SlashCommand,WebFetch"

      - name: Turn the verdict into an exit status and a check run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail

          fail_check() {
            gh api -X POST "repos/${GITHUB_REPOSITORY}/check-runs" \
              -f name="quetrex review gate" \
              -f head_sha="$HEAD_SHA" \
              -f status="completed" \
              -f conclusion="$1" \
              -f "output[title]=$2" \
              -f "output[summary]=$3" >/dev/null 2>&1 \
              || echo "::warning::could not publish the check run (fork PRs get a read-only token)"
          }

          V=".quetrex/review-verdict.json"

          if [ ! -f "$V" ]; then
            fail_check "failure" "No verdict written" "The review gate produced no .quetrex/review-verdict.json. Absence of a verdict is not an approval."
            echo "::error::the review gate wrote no verdict — treating as NOT REVIEWED"
            exit 1
          fi
          if ! jq -e . "$V" >/dev/null 2>&1; then
            fail_check "failure" "Unparseable verdict" "The review gate wrote .quetrex/review-verdict.json but it is not valid JSON."
            echo "::error::review-verdict.json is not valid JSON"
            exit 1
          fi

          VERDICT="$(jq -r '.verdict // "MISSING"' "$V")"
          VSHA="$(jq -r '.sha // ""' "$V")"
          NREV="$(jq -r '.inputs.nativeReview // "missing"' "$V")"
          NSEC="$(jq -r '.inputs.nativeSecurityReview // "missing"' "$V")"
          SUMMARY="verdict=${VERDICT} sha=${VSHA:0:12} nativeReview=${NREV} nativeSecurityReview=${NSEC}"
          echo "$SUMMARY"

          if [ "$VSHA" != "$HEAD_SHA" ]; then
            fail_check "failure" "Verdict is not pinned to this commit" "$SUMMARY (expected sha ${HEAD_SHA})"
            echo "::error::verdict sha ${VSHA} does not match the reviewed commit ${HEAD_SHA}"
            exit 1
          fi

          # An AUTO_MERGE that admits its security review never ran is exactly the
          # self-exemption this workflow exists to make impossible.
          case "$VERDICT" in
            AUTO_MERGE)
              case "$NSEC" in
                clean|issues) ;;
                *)
                  fail_check "failure" "AUTO_MERGE without a native security review" "$SUMMARY"
                  echo "::error::AUTO_MERGE requires nativeSecurityReview to be clean or issues, got '${NSEC}'"
                  exit 1
                  ;;
              esac
              fail_check "success" "AUTO_MERGE" "$SUMMARY"
              ;;
            REWORK)
              fail_check "failure" "REWORK" "$SUMMARY"
              echo "::error::review gate returned REWORK"
              exit 1
              ;;
            ESCALATE_HUMAN)
              fail_check "action_required" "ESCALATE_HUMAN" "$SUMMARY"
              echo "::error::review gate returned ESCALATE_HUMAN — a person must decide"
              exit 1
              ;;
            *)
              fail_check "failure" "Unknown verdict" "$SUMMARY"
              echo "::error::unknown verdict '${VERDICT}'"
              exit 1
              ;;
          esac

      - name: Publish the verdict artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-verdict-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .quetrex/review-verdict.json
            .quetrex/security-findings.json
          if-no-files-found: warn
          retention-days: 30
